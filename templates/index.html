<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Video Recorder</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>🎥 Video Recorder</h1>

        <p>
            Camera permission allow karke recording start karein.
        </p>

        <video id="preview"
               autoplay
               muted
               playsinline>
        </video>

        <div id="timer">Ready</div>

        <button id="startBtn">
            🔴 Start Recording
        </button>

        <p id="status">
            Camera start ho rahi hai...
        </p>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
